name: Re-seed hosted demo

# Visitors can log, confirm and correct complaints on the hosted demo, so its database drifts.
# Every night it is dropped and loaded again with the seeded story from recorded model responses.
on:
  schedule:
    - cron: '0 2 * * *' # 03:00 Vienna in winter, 04:00 in summer
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reseed
  cancel-in-progress: false

jobs:
  reseed:
    runs-on: ubuntu-latest
    env:
      TRIAGE_PROVIDER: demo
      # The seed user: it drops the database and recreates validators and indexes, which the app user may not.
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DB: playnt
      MONGOMS_DISABLE_POSTINSTALL: '1'
    steps:
      - name: Check the secret is set
        run: |
          if [ -z "$MONGODB_URI" ]; then
            echo "::error::Add the MONGODB_URI repository secret (Settings, Secrets and variables, Actions)."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build shared package
        run: npm run build -w packages/shared
      - name: Seed the demo story
        run: npm run seed
